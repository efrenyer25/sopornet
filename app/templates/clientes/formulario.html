{% extends "base.html" %}
{% block titulo %}{{ 'Editar cliente' if cliente else 'Nuevo cliente' }}{% endblock %}
{% block contenido %}
<div class="encabezado"><h1>{{ 'Editar cliente' if cliente else 'Nuevo cliente' }}</h1></div>
<form class="tarjeta" method="post" style="max-width:760px">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="fila">
    <div class="campo">
      <label for="nombre">Nombre o razón social *</label>
      <input id="nombre" name="nombre" value="{{ datos.nombre or '' }}" required minlength="3">
    </div>
    <div class="campo">
      <label for="documento">Cédula / RIF *</label>
      <input id="documento" name="documento" value="{{ datos.documento or '' }}" required
             pattern="[VEJGPvejgp]-\d{6,9}(-\d)?" placeholder="V-12345678">
    </div>
  </div>
  <div class="fila">
    <div class="campo">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" value="{{ datos.email or '' }}">
    </div>
    <div class="campo">
      <label for="telefono">Teléfono</label>
      <input id="telefono" name="telefono" value="{{ datos.telefono or '' }}" placeholder="0412-1234567">
    </div>
  </div>
  <div class="campo">
    <label for="direccion">Dirección</label>
    <input id="direccion" name="direccion" value="{{ datos.direccion or '' }}">
  </div>
  <div class="campo">
    <label for="plan">Plan contratado</label>
    <input id="plan" name="plan" value="{{ datos.plan or '' }}" list="planes" placeholder="Fibra 300 Mbps">
    <datalist id="planes">
      <option value="Fibra 100 Mbps"><option value="Fibra 300 Mbps"><option value="Fibra 500 Mbps"><option value="Empresarial 1 Gbps">
    </datalist>
  </div>
  <div class="acciones">
    <button class="btn">Guardar</button>
    <a class="btn btn-sec" href="{{ url_for('clientes.detalle', cliente_id=cliente.id) if cliente else url_for('clientes.listar') }}">Cancelar</a>
  </div>
</form>
{% endblock %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · SoporteNet</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="login-fondo">
  <div class="login-caja">
    <div class="marca" style="color:#fff"><span class="marca-icono">📡</span> SoporteNet</div>
    <div class="tarjeta">
      <h1>Crear cuenta</h1>
      <p class="ayuda" style="margin-top:0">Regístrate para gestionar tickets de soporte.</p>

      {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
          <div class="alerta alerta-{{ categoria }}" style="margin-bottom:.5rem">{{ mensaje }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" id="form-registro" novalidate>
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" value="{{ datos.nombre }}" required minlength="3" autofocus autocomplete="name">
        </div>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" value="{{ datos.email }}" required autocomplete="email">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
          <span class="ayuda">Mínimo 8 caracteres, con letras y números.</span>
        </div>
        <div class="campo">
          <label for="confirmar">Confirmar contraseña</label>
          <input id="confirmar" name="confirmar" type="password" required autocomplete="new-password">
          <span class="ayuda" id="aviso-confirmar" aria-live="polite"></span>
        </div>
        <button class="btn" style="width:100%">Crear cuenta</button>
      </form>
      <p class="ayuda" style="text-align:center;margin-bottom:0">
        ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
<script>
  // Validación en vivo: avisa si las contraseñas no coinciden
  const clave = document.getElementById("password");
  const confirmar = document.getElementById("confirmar");
  const aviso = document.getElementById("aviso-confirmar");
  function revisar() {
    if (!confirmar.value) { aviso.textContent = ""; return; }
    const iguales = clave.value === confirmar.value;
    aviso.textContent = iguales ? "✓ Las contraseñas coinciden" : "✗ Las contraseñas no coinciden";
    aviso.style.color = iguales ? "var(--exito)" : "var(--peligro)";
  }
  clave.addEventListener("input", revisar);
  confirmar.addEventListener("input", revisar);
</script>
</body>
</html>
